services:
  app:
    image: ${IMAGE:-ghcr.io/carsio/music-search-engine:latest}
    pull_policy: always
    ports:
      - "80:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
